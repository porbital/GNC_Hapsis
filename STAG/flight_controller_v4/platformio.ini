; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f091rc]
platform = ststm32
board = nucleo_f091rc
framework = arduino
monitor_speed = 115200
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f0x.cfg -c "reset_config none" -c "program {$SOURCE} verify reset exit"


lib_deps = 
  greiman/SdFat @ ^2.2.3
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit BMP3XX Library@^2.1.6
  adafruit/Adafruit BNO055@^1.6.4

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
  greiman/SdFat @ ^2.2.3
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit BMP3XX Library@^2.1.6
  adafruit/Adafruit BNO055@^1.6.4

[env:rpipicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps = 
  greiman/SdFat @ ^2.2.3
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit BMP3XX Library@^2.1.6
  adafruit/Adafruit BNO055@^1.6.4